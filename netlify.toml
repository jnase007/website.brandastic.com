[build]
  publish = "public"

[[redirects]]
  from = "/onboarding"
  to = "/"
  status = 301

[[redirects]]
  from = "/onboarding/"
  to = "/"
  status = 301

[[redirects]]
  from = "/onboarding/admin/*"
  to = "/admin/:splat"
  status = 301

[[redirects]]
  from = "/onboarding/admin"
  to = "/admin"
  status = 301
